  <text x="20" y="240" font-family="'Courier New', monospace" font-size="13" fill="#00ff00">  Threat Intel</text>
  <text x="20" y="280" font-family="'Courier New', monospace" font-size="13" fill="#00ff00">  Incidents</text>

