  <rect x="245" y="182" width="160" height="28" rx="3" stroke="#00ffff" stroke-width="1" fill="#2a2a4a"/>
  <text x="255" y="200" font-family="'Courier New', monospace" font-size="12" fill="#00ff00">IP_SINGLE ▾</text>

  <text x="430" y="175" font-family="'Courier New', monospace" font-size="12" fill="#00ffff">Value (IP, CIDR, Country, Org):</text>
  <rect x="430" y="182" width="220" height="28" rx="3" stroke="#00ffff" stroke-width="1" fill="#2a2a4a"/>
  <text x="440" y="200" font-family="'Courier New', monospace" font-size="12" fill="#00ff00">e.g., 192.168.1.1</text>

